<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mood Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered working column — script box, mood chips, voice dials, transport bar. */
:root {
  --bg: #f3f4f7;
  --panel: #ffffff;
  --ink: #1b1d2a;
  --muted: #5d6275;
  --line: #d9dce6;
  --accent: #3b4fd8;
  --mood: #3b4fd8;
  --mood-soft: #e6e9fb;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Atkinson Hyperlegible", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12131b; --panel: #1b1d28; --ink: #eceef6; --muted: #9aa0b6;
    --line: #2d3040; --accent: #8e9cff; --mood-soft: #262a40; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12131b; --panel: #1b1d28; --ink: #eceef6; --muted: #9aa0b6;
  --line: #2d3040; --accent: #8e9cff; --mood-soft: #262a40; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 46rem; margin: 0 auto; padding-inline: 16px; padding-block: 2rem 3rem; display: grid; gap: 1.5rem; }
header { display: grid; gap: .25rem; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 6vw, 2.75rem); line-height: 1.05; margin: 0; text-wrap: balance; }
h1 em { font-style: normal; color: var(--mood); transition: color .3s; }
.lede { margin: 0; color: var(--muted); max-width: 60ch; }
.label { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 1rem; display: grid; gap: .75rem; min-width: 0; }
textarea { width: 100%; min-height: 9rem; resize: vertical; border: 0; background: transparent; color: var(--ink); font: 1.1rem/1.6 var(--font-body); outline: none; }
.reading { font-size: 1.1rem; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }
.reading span { border-radius: 4px; transition: background .15s; }
.reading span.now { background: var(--mood-soft); box-shadow: 0 0 0 2px var(--mood-soft); color: var(--ink); }
.reading span.done { color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.row.between { justify-content: space-between; }
.moods { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: .5rem; }
.mood { --c: var(--accent); display: grid; gap: .1rem; text-align: left; padding: .6rem .75rem; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; cursor: pointer; }
.mood b { font-weight: 700; display: flex; align-items: center; gap: .45rem; }
.mood b::before { content: ""; width: .6rem; height: .6rem; border-radius: 50%; background: var(--c); flex: none; }
.mood small { color: var(--muted); font-size: .8rem; }
.mood[aria-pressed="true"] { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
.mood:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dials { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 1rem; }
.dial { display: grid; gap: .3rem; }
.dial .row { justify-content: space-between; }
.dial output { font-family: var(--font-mono); font-size: .85rem; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--mood); }
select { width: 100%; padding: .5rem; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; }
.transport { position: sticky; bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
.transport .panel { flex-direction: row; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; box-shadow: 0 8px 24px rgb(0 0 0 / .08); }
button.btn { font: 700 1rem var(--font-body); border-radius: 999px; padding: .65rem 1.3rem; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
button.btn.primary { background: var(--mood); border-color: var(--mood); color: #fff; }
button.btn:disabled { opacity: .45; cursor: not-allowed; }
.status { color: var(--muted); font-size: .9rem; margin-left: auto; min-width: 0; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-size: .9rem; cursor: pointer; text-decoration: underline; }
.warn { color: #b3261e; }
.engines { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: .5rem; }
.engine { display: grid; grid-template-columns: auto 1fr; column-gap: .5rem; align-items: start; padding: .7rem .8rem; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.engine input { margin-top: .3rem; accent-color: var(--mood); grid-row: span 2; }
.engine small { color: var(--muted); font-size: .8rem; }
.engine:has(input:checked) { border-color: var(--mood); box-shadow: inset 0 0 0 1px var(--mood); }
.ai { display: grid; gap: .75rem; }
input[type=password], input[type=text] { width: 100%; padding: .5rem; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; }
.hint { color: var(--muted); font-size: .8rem; }
.hint a { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <span class="label">Text to speech</span>
    <h1>Read it out <em id="moodWord">happy</em>.</h1>
    <p class="lede">Type or paste anything, pick a mood, and press Read. The human voices act out the mood like a voice actor. Put *stars* around a word to stress it.</p>
  </header>

  <section class="panel" aria-label="Your text">
    <div class="row between">
      <span class="label">Your text</span>
      <button class="link" id="clearBtn" type="button">Clear</button>
    </div>
    <textarea id="text" aria-label="Text to read aloud">Guess what? I finally finished the project! It took three *long* weeks, but it's done. Honestly, I can't believe it worked on the first try.</textarea>
    <div class="reading" id="reading" hidden></div>
  </section>

  <section class="panel" aria-label="Mood">
    <span class="label">Mood</span>
    <div class="moods" id="moods"></div>
  </section>

  <section class="panel" aria-label="Voice type">
    <span class="label">Voice type</span>
    <div class="engines" role="radiogroup" aria-label="Voice type">
      <label class="engine"><input type="radio" name="engine" value="openai"><b>Human voice · OpenAI</b><small>Acts out the mood from a direction. About $0.015 per minute.</small></label>
      <label class="engine"><input type="radio" name="engine" value="eleven"><b>Human voice · ElevenLabs</b><small>Most lifelike. Free tier, then paid plans.</small></label>
      <label class="engine"><input type="radio" name="engine" value="device"><b>Device voice</b><small>Free and offline, but sounds robotic.</small></label>
    </div>
    <div class="ai" id="aiBox">
      <div class="dial">
        <label for="apiKey" class="label" id="keyLabel">API key</label>
        <input type="password" id="apiKey" autocomplete="off" spellcheck="false" placeholder="Paste your key">
        <small class="hint" id="keyHint"></small>
      </div>
      <div class="dial">
        <label for="aiVoice" class="label">Voice</label>
        <select id="aiVoice"></select>
      </div>
      <div class="dial">
        <label for="direction" class="label">Extra direction (optional)</label>
        <input type="text" id="direction" placeholder="e.g. like a bedtime story, British accent">
      </div>
    </div>
  </section>

  <section class="panel" aria-label="Voice" id="deviceBox">
    <div class="row between">
      <span class="label">Voice &amp; fine-tuning</span>
      <button class="link" id="resetBtn" type="button">Reset to mood</button>
    </div>
    <div class="dial">
      <label for="voice" class="label">Voice</label>
      <select id="voice"></select>
    </div>
    <div class="dials">
      <div class="dial"><div class="row"><label for="pitch">Pitch</label><output id="pitchOut"></output></div><input type="range" id="pitch" min="0" max="2" step="0.05"></div>
      <div class="dial"><div class="row"><label for="rate">Speed</label><output id="rateOut"></output></div><input type="range" id="rate" min="0.5" max="2" step="0.05"></div>
      <div class="dial"><div class="row"><label for="volume">Loudness</label><output id="volumeOut"></output></div><input type="range" id="volume" min="0" max="1" step="0.05"></div>
      <div class="dial"><div class="row"><label for="pause">Pause between phrases</label><output id="pauseOut"></output></div><input type="range" id="pause" min="0" max="1500" step="50"></div>
    </div>
  </section>

  <div class="transport">
    <div class="panel">
      <button class="btn primary" id="playBtn" type="button">▶ Read</button>
      <button class="btn" id="pauseBtn" type="button" disabled>Pause</button>
      <button class="btn" id="stopBtn" type="button" disabled>Stop</button>
      <button class="btn" id="saveBtn" type="button" hidden>Save MP3</button>
      <span class="status" id="status" role="status">Ready</span>
    </div>
  </div>
</div>

<script>
(() => {
  // Each mood: base pitch/rate/volume, pause (ms) between phrases,
  // wobble = random pitch/rate variation per phrase, lift = extra pitch on "!" and "?" phrases.
  // Values stay close to 1.0: big pitch/speed jumps are what make browser voices sound robotic.
  // direct = acting direction for OpenAI, tag = audio tag for ElevenLabs v3.
  const MOODS = {
    neutral:   { name: "Neutral",   hint: "Plain and even",     color: "#6b7280", pitch: 1.0,  rate: 1.0,  volume: 1.0, pause: 350, wobble: 0.03, lift: 0.08, tag: "",
      direct: "Speak naturally and conversationally, like a person reading to a friend. Even, relaxed tone." },
    happy:     { name: "Happy",     hint: "Bright and warm",    color: "#e0a100", pitch: 1.18, rate: 1.06, volume: 1.0, pause: 300, wobble: 0.06, lift: 0.15, tag: "[happy]",
      direct: "Sound genuinely happy and warm, like you're smiling while you talk. Bright, friendly, upbeat." },
    excited:   { name: "Excited",   hint: "Fast, high, bouncy", color: "#f05a28", pitch: 1.3,  rate: 1.18, volume: 1.0, pause: 180, wobble: 0.1,  lift: 0.2,  tag: "[excited]",
      direct: "Sound thrilled and full of energy, almost bursting. Quick pace, big rises in pitch, a little laugh in the voice." },
    sad:       { name: "Sad",       hint: "Low, slow, heavy",   color: "#3f6fb5", pitch: 0.82, rate: 0.84, volume: 0.75,pause: 750, wobble: 0.03, lift: 0,    tag: "[sad]",
      direct: "Sound sad and heavy-hearted, close to tears. Slow, soft, lower pitch, with long pauses and sighs." },
    angry:     { name: "Angry",     hint: "Hard and punchy",    color: "#d0312d", pitch: 0.9,  rate: 1.12, volume: 1.0, pause: 300, wobble: 0.05, lift: 0.05, tag: "[angry]",
      direct: "Sound angry and frustrated. Firm, clipped, forceful words, hitting the key words hard." },
    calm:      { name: "Calm",      hint: "Soft and steady",    color: "#2f9e7a", pitch: 0.95, rate: 0.88, volume: 0.85,pause: 600, wobble: 0.02, lift: 0.03, tag: "[calmly]",
      direct: "Sound calm and soothing, like a meditation guide. Slow, gentle, steady, with relaxed pauses." },
    scared:    { name: "Scared",    hint: "Shaky and hurried",  color: "#7b4fc9", pitch: 1.15, rate: 1.12, volume: 0.8, pause: 400, wobble: 0.14, lift: 0.18, tag: "[nervously]",
      direct: "Sound scared and anxious. Shaky, breathy voice, hurried words, nervous hesitations." },
    surprised: { name: "Surprised", hint: "Big rises",          color: "#d63384", pitch: 1.22, rate: 1.02, volume: 1.0, pause: 350, wobble: 0.08, lift: 0.3,  tag: "[surprised]",
      direct: "Sound amazed and surprised, like you just heard unbelievable news. Big rises in pitch, gasps of disbelief." },
    whisper:   { name: "Secretive", hint: "Quiet and low",      color: "#4b5563", pitch: 0.9,  rate: 0.9,  volume: 0.45,pause: 500, wobble: 0.02, lift: 0,    tag: "[whispers]",
      direct: "Whisper, as if sharing a secret you don't want anyone else to hear. Hushed, close, breathy." },
  };

  // Names that browsers give their most natural-sounding (neural / premium) voices.
  const NATURAL = /natural|neural|online|premium|enhanced|siri|google/i;
  const voiceScore = v =>
    (NATURAL.test(v.name) ? 10 : 0) +
    (/natural|neural|premium|enhanced/i.test(v.name) ? 5 : 0) +
    (v.lang === navigator.language ? 3 : v.lang.slice(0, 2) === (navigator.language || "en").slice(0, 2) ? 2 : 0) +
    (/^(samantha|daniel|karen|moira|serena|ava|allison|evan|zoe)/i.test(v.name) ? 4 : 0) +
    (v.localService ? 0 : 1);

  const $ = id => document.getElementById(id);
  const synth = window.speechSynthesis;
  const els = { text: $("text"), reading: $("reading"), moods: $("moods"), voice: $("voice"),
    pitch: $("pitch"), rate: $("rate"), volume: $("volume"), pause: $("pause"),
    play: $("playBtn"), pauseBtn: $("pauseBtn"), stop: $("stopBtn"), status: $("status") };

  let mood = "happy";
  let queue = [], idx = 0, running = false, paused = false, timer = null, token = 0;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };


  // Mood chips
  for (const [key, m] of Object.entries(MOODS)) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "mood"; b.dataset.mood = key;
    b.style.setProperty("--c", m.color);
    b.innerHTML = `<b>${m.name}</b><small>${m.hint}</small>`;
    b.addEventListener("click", () => setMood(key));
    els.moods.appendChild(b);
  }

  function setMood(key) {
    mood = key;
    const m = MOODS[key];
    document.documentElement.style.setProperty("--mood", m.color);
    $("moodWord").textContent = m.name.toLowerCase();
    els.moods.querySelectorAll(".mood").forEach(b => b.setAttribute("aria-pressed", b.dataset.mood === key));
    els.pitch.value = m.pitch; els.rate.value = m.rate; els.volume.value = m.volume; els.pause.value = m.pause;
    showDials();
    store.set("moodreader.mood", key);
  }

  function showDials() {
    $("pitchOut").textContent = (+els.pitch.value).toFixed(2) + "×";
    $("rateOut").textContent = (+els.rate.value).toFixed(2) + "×";
    $("volumeOut").textContent = Math.round(els.volume.value * 100) + "%";
    $("pauseOut").textContent = els.pause.value + " ms";
  }
  ["pitch", "rate", "volume", "pause"].forEach(k => els[k].addEventListener("input", showDials));
  $("resetBtn").addEventListener("click", () => setMood(mood));

  // Voices load asynchronously in most browsers
  function loadVoices() {
    if (!synth) return;
    const voices = synth.getVoices();
    if (!voices.length) return;
    const saved = store.get("moodreader.voice");
    els.voice.innerHTML = "";
    const sorted = voices.slice().sort((a, b) => voiceScore(b) - voiceScore(a) || a.name.localeCompare(b.name));
    sorted.forEach(v => {
      const o = document.createElement("option");
      o.value = v.name;
      o.textContent = `${NATURAL.test(v.name) ? "★ " : ""}${v.name} (${v.lang})`;
      els.voice.appendChild(o);
    });
    // Keep the voice the person chose; otherwise start on the most natural one.
    els.voice.value = sorted.some(v => v.name === saved) ? saved : sorted[0].name;
  }
  if (synth) { loadVoices(); synth.addEventListener?.("voiceschanged", loadVoices); }
  els.voice.addEventListener("change", () => store.set("moodreader.voice", els.voice.value));

  // Split text into phrases; keep the exact source text for highlighting
  // Breaks at commas and sentence ends, like a person taking breaths.
  function phrases(text) {
    return (text.match(/[^.!?…,;:\n]+[.!?…,;:]*[\s]*|\n+/g) || []).filter(Boolean);
  }

  // Emphasis: *word* or WORD in a phrase gets a little more pitch and volume.
  const hasEmphasis = s => /\*[^*]+\*/.test(s) || /\b[A-Z]{2,}\b/.test(s.replace(/\b(I|OK|TV|USA|UK)\b/g, ""));
  const speakable = s => s.replace(/\*/g, "").replace(/\b[A-Z]{2,}\b/g, w => w.length > 3 ? w.toLowerCase() : w);

  function renderReading(parts) {
    els.reading.innerHTML = "";
    parts.forEach(p => {
      const s = document.createElement("span");
      s.textContent = p;
      els.reading.appendChild(s);
    });
  }

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const jitter = amt => (Math.random() * 2 - 1) * amt;

  function speakNext(my) {
    if (my !== token) return;
    const spans = els.reading.children;
    if (idx > 0 && spans[idx - 1]) { spans[idx - 1].classList.remove("now"); spans[idx - 1].classList.add("done"); }
    if (idx >= queue.length) return finish("Done");

    const part = queue[idx];
    const clean = part.trim();
    if (!clean) { idx++; return speakNext(my); }

    const m = MOODS[mood];
    const base = { pitch: +els.pitch.value, rate: +els.rate.value, volume: +els.volume.value };
    const u = new SpeechSynthesisUtterance(speakable(clean));
    const exclaim = /[!?]\s*$/.test(clean);
    const endsSentence = /[.!?…]\s*$/.test(clean);
    const firstOfSentence = idx === 0 || /[.!?…\n]\s*$/.test(queue[idx - 1]);
    const emph = hasEmphasis(clean);
    // People start a sentence a touch higher and quicker, then settle and slow down at the end.
    let pitch = base.pitch + jitter(m.wobble) + (exclaim ? m.lift : 0) + (emph ? 0.08 : 0);
    let rate = base.rate * (1 + jitter(m.wobble / 2));
    if (firstOfSentence && !endsSentence) { pitch += 0.04; rate *= 1.03; }
    if (endsSentence && !exclaim) { pitch -= 0.04; rate *= 0.96; }
    if (exclaim && mood === "angry") rate *= 1.08;
    u.pitch = clamp(pitch, 0, 2);
    u.rate = clamp(rate, 0.1, 10);
    u.volume = clamp(base.volume + (emph ? 0.1 : 0), 0, 1);
    const v = synth.getVoices().find(v => v.name === els.voice.value);
    if (v) { u.voice = v; u.lang = v.lang; }

    spans[idx]?.classList.add("now");
    u.onend = () => {
      if (my !== token) return;
      idx++;
      // Short breath at commas, full pause at sentence ends, never exactly the same length.
      const paragraph = /\n/.test(queue[idx] || "");
      const wait = +els.pause.value * (paragraph ? 1.8 : endsSentence ? 1 : 0.35) * (0.75 + Math.random() * 0.5);
      timer = setTimeout(() => speakNext(my), wait);
    };
    u.onerror = e => {
      if (my !== token || e.error === "interrupted" || e.error === "canceled") return;
      finish("Couldn't speak: " + e.error);
    };
    synth.speak(u);
  }

  // ---------- Human (AI) voices ----------
  const ENGINES = {
    openai: {
      keyLabel: "OpenAI API key",
      hint: 'Create one at <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">platform.openai.com/api-keys</a> (needs a little credit). It is saved only in this browser.',
      voices: [["coral","Coral (warm, female)"],["marin","Marin (natural, female)"],["cedar","Cedar (natural, male)"],["nova","Nova (bright, female)"],["shimmer","Shimmer (soft, female)"],["sage","Sage (calm, female)"],["ballad","Ballad (gentle, male)"],["verse","Verse (expressive, male)"],["ash","Ash (clear, male)"],["echo","Echo (deep, male)"],["onyx","Onyx (low, male)"],["fable","Fable (storyteller)"],["alloy","Alloy (neutral)"]],
    },
    eleven: {
      keyLabel: "ElevenLabs API key",
      hint: 'Create one at <a href="https://elevenlabs.io/app/settings/api-keys" target="_blank" rel="noopener">elevenlabs.io → Settings → API keys</a>. Free plan included. It is saved only in this browser. Your own voices appear here once the key is in.',
      voices: [["JBFqnCBsd6RMkjVDRZzb","George (warm, male)"],["21m00Tcm4TlvDq8ikWAM","Rachel (calm, female)"],["EXAVITQu4vr4xnSDxMaL","Sarah (soft, female)"],["pNInz6obpgDQGcFmaJgB","Adam (deep, male)"]],
    },
  };
  const ai = { apiKey: $("apiKey"), voice: $("aiVoice"), direction: $("direction"), box: $("aiBox"), deviceBox: $("deviceBox"), save: $("saveBtn") };
  let engine = "openai", audio = null, endPlay = null, blobs = [];

  function setEngine(e) {
    engine = ENGINES[e] || e === "device" ? e : "openai";
    document.querySelectorAll('input[name=engine]').forEach(r => r.checked = r.value === engine);
    const isAI = engine !== "device";
    ai.box.hidden = !isAI; ai.deviceBox.hidden = isAI;
    store.set("moodreader.engine", engine);
    if (isAI) {
      $("keyLabel").textContent = ENGINES[engine].keyLabel;
      $("keyHint").innerHTML = ENGINES[engine].hint;
      ai.apiKey.value = store.get("moodreader.key." + engine) || "";
      fillAiVoices(ENGINES[engine].voices);
      if (engine === "eleven" && ai.apiKey.value) loadElevenVoices();
    }
  }

  function fillAiVoices(list) {
    const saved = store.get("moodreader.aivoice." + engine);
    ai.voice.innerHTML = "";
    list.forEach(([id, label]) => { const o = document.createElement("option"); o.value = id; o.textContent = label; ai.voice.appendChild(o); });
    if (list.some(([id]) => id === saved)) ai.voice.value = saved;
  }

  async function loadElevenVoices() {
    try {
      const r = await fetch("https://api.elevenlabs.io/v1/voices", { headers: { "xi-api-key": ai.apiKey.value.trim() } });
      if (!r.ok || engine !== "eleven") return;
      const { voices } = await r.json();
      if (voices?.length) fillAiVoices(voices.map(v => [v.voice_id, v.name + (v.labels?.gender ? ` (${v.labels.gender})` : "")]));
    } catch {}
  }

  document.querySelectorAll('input[name=engine]').forEach(r => r.addEventListener("change", () => { stop(true); setEngine(r.value); }));
  ai.apiKey.addEventListener("change", () => {
    store.set("moodreader.key." + engine, ai.apiKey.value.trim());
    if (engine === "eleven") loadElevenVoices();
  });
  ai.voice.addEventListener("change", () => store.set("moodreader.aivoice." + engine, ai.voice.value));
  ai.direction.addEventListener("change", () => store.set("moodreader.direction", ai.direction.value));
  ai.direction.value = store.get("moodreader.direction") || "";

  // Group whole sentences into chunks so long text starts playing quickly.
  function chunks(text, max) {
    const sentences = text.match(/[^.!?…\n]+[.!?…]*[\s]*|\n+/g) || [];
    const out = [];
    let cur = "";
    for (const s of sentences) {
      if (cur && (cur + s).length > max) { out.push(cur); cur = ""; }
      cur += s;
    }
    if (cur) out.push(cur);
    return out;
  }

  // *word* becomes WORD, which both services read as stressed.
  const stress = s => s.replace(/\*([^*]+)\*/g, (_, w) => w.toUpperCase());

  async function fetchAudio(part, eleModel = "eleven_v3") {
    const key = ai.apiKey.value.trim();
    const m = MOODS[mood];
    const extra = ai.direction.value.trim();
    let r;
    try {
      if (engine === "openai") {
        r = await fetch("https://api.openai.com/v1/audio/speech", {
          method: "POST",
          headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "gpt-4o-mini-tts", voice: ai.voice.value, input: stress(part).trim(), response_format: "mp3",
            instructions: `${m.direct}${extra ? " Also: " + extra + "." : ""} Words in capitals are stressed, not shouted.`,
          }),
        });
      } else {
        const tagged = eleModel === "eleven_v3" && m.tag
          ? stress(part).trim().replace(/(^|[.!?…]\s+)(?=\S)/g, `$1${m.tag} `)
          : stress(part).trim();
        r = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(ai.voice.value)}?output_format=mp3_44100_128`, {
          method: "POST",
          headers: { "xi-api-key": key, "Content-Type": "application/json" },
          body: JSON.stringify({ text: tagged, model_id: eleModel, voice_settings: { stability: 0.5 } }),
        });
        // Older accounts may not have the v3 model yet: fall back without the mood tags.
        if (!r.ok && eleModel === "eleven_v3" && (r.status === 400 || r.status === 422)) return fetchAudio(part, "eleven_multilingual_v2");
      }
    } catch {
      throw new Error("Couldn't reach the voice service. Check your internet. This only works when the page is opened as a file or website, not inside the Claude app.");
    }
    if (!r.ok) {
      let detail = "";
      try { const j = await r.json(); detail = j.error?.message || j.detail?.message || (typeof j.detail === "string" ? j.detail : ""); } catch {}
      if (r.status === 401) throw new Error("The API key was rejected. Check it and paste it again.");
      if (r.status === 429 || r.status === 402) throw new Error("Out of credit or too many requests. " + detail);
      throw new Error(`The voice service said no (${r.status}). ${detail}`);
    }
    return r.blob();
  }

  // One shared player, unlocked by the Read tap, so phones allow it to play after the download.
  const player = new Audio();
  function silentWav() {
    const b = new DataView(new ArrayBuffer(46));
    const w = (o, str) => [...str].forEach((c, i) => b.setUint8(o + i, c.charCodeAt(0)));
    w(0, "RIFF"); b.setUint32(4, 38, true); w(8, "WAVEfmt "); b.setUint32(16, 16, true);
    b.setUint16(20, 1, true); b.setUint16(22, 1, true); b.setUint32(24, 8000, true); b.setUint32(28, 16000, true);
    b.setUint16(32, 2, true); b.setUint16(34, 16, true); w(36, "data"); b.setUint32(40, 2, true);
    return URL.createObjectURL(new Blob([b], { type: "audio/wav" }));
  }
  const SILENT = silentWav();
  function unlockAudio() { player.src = SILENT; player.play().catch(() => {}); }

  function playBlob(blob) {
    return new Promise((resolve, reject) => {
      audio = player;
      player.src = URL.createObjectURL(blob);
      endPlay = resolve;
      player.onended = () => resolve();
      player.onerror = () => resolve();
      if (!paused) player.play().catch(() => reject(new Error("Your browser blocked the sound. Tap Read again.")));
    });
  }

  async function startAI(text, my) {
    if (!ai.apiKey.value.trim()) {
      finish("Paste your API key first.", true);
      ai.apiKey.focus();
      return;
    }
    const parts = chunks(text, 900);
    renderReading(parts);
    blobs = [];
    const spans = els.reading.children;
    els.status.textContent = "Recording the voice…";
    let next = fetchAudio(parts[0]);
    for (let i = 0; i < parts.length; i++) {
      let blob;
      try { blob = await next; } catch (e) { if (my === token) finish(e.message, true); return; }
      if (my !== token) return;
      if (i + 1 < parts.length) { next = fetchAudio(parts[i + 1]); next.catch(() => {}); }
      blobs.push(blob);
      if (i > 0) { spans[i - 1].classList.remove("now"); spans[i - 1].classList.add("done"); }
      spans[i].classList.add("now");
      if (!paused) els.status.textContent = `Reading as ${MOODS[mood].name.toLowerCase()}…`;
      try { await playBlob(blob); } catch (e) { if (my === token) finish(e.message, true); return; }
      if (my !== token) return;
      if (i + 1 < parts.length) els.status.textContent = "Recording the next part…";
    }
    spans[parts.length - 1]?.classList.remove("now");
    ai.save.hidden = false;
    finish("Done");
  }

  ai.save.addEventListener("click", () => {
    if (!blobs.length) return;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(blobs, { type: "audio/mpeg" }));
    a.download = `mood-reader-${mood}.mp3`;
    document.body.appendChild(a); a.click(); a.remove();
  });

  // ---------- Controls ----------
  function start() {
    const text = els.text.value;
    if (!text.trim()) { els.status.textContent = "Type something to read first."; els.text.focus(); return; }
    stop(true);
    token++;
    running = true; paused = false;
    ai.save.hidden = true;
    els.text.hidden = true; els.reading.hidden = false;
    setButtons();
    if (engine !== "device") { unlockAudio(); return startAI(text, token); }
    if (!synth) return finish("This browser can't speak text. Try Chrome, Edge or Safari.", true);
    queue = phrases(text);
    idx = 0;
    renderReading(queue);
    els.status.textContent = `Reading as ${MOODS[mood].name.toLowerCase()}…`;
    speakNext(token);
  }

  function stop(silent) {
    token++;
    clearTimeout(timer);
    if (synth) synth.cancel();
    if (audio) { audio.pause(); audio.onended = audio.onerror = null; audio = null; }
    if (endPlay) { endPlay(); endPlay = null; }
    running = false; paused = false;
    els.text.hidden = false; els.reading.hidden = true;
    els.status.classList.remove("warn");
    setButtons();
    if (!silent) els.status.textContent = "Stopped";
  }

  function finish(msg, isError) {
    running = false; paused = false;
    setButtons();
    els.status.textContent = msg;
    els.status.classList.toggle("warn", !!isError);
    setTimeout(() => { if (!running) { els.text.hidden = false; els.reading.hidden = true; } }, isError ? 0 : 1200);
  }

  function togglePause() {
    if (!running) return;
    const dev = engine === "device";
    if (paused) { dev ? synth.resume() : (audio && !audio.ended && audio.play().catch(() => {})); paused = false; els.status.textContent = "Reading…"; }
    else { dev ? synth.pause() : audio?.pause(); paused = true; els.status.textContent = "Paused"; }
    setButtons();
  }

  function setButtons() {
    els.play.textContent = running ? "↻ Restart" : "▶ Read";
    els.pauseBtn.disabled = !running;
    els.pauseBtn.textContent = paused ? "Resume" : "Pause";
    els.stop.disabled = !running;
  }

  els.play.addEventListener("click", start);
  els.pauseBtn.addEventListener("click", togglePause);
  els.stop.addEventListener("click", () => stop(false));
  $("clearBtn").addEventListener("click", () => { stop(true); els.text.value = ""; store.set("moodreader.text", ""); els.text.focus(); });
  els.reading.addEventListener("click", () => stop(false));

  const savedText = store.get("moodreader.text");
  if (savedText) els.text.value = savedText;
  els.text.addEventListener("input", () => store.set("moodreader.text", els.text.value));

  const savedMood = store.get("moodreader.mood");
  setMood(MOODS[savedMood] ? savedMood : "happy");
  setEngine(store.get("moodreader.engine") || "openai");
  setButtons();
})();
</script>
</body>
</html>
