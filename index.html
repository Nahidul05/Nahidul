<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mood Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered working column — script box, mood chips, voice dials, transport bar. */
:root {
  --bg: #f3f4f7;
  --panel: #ffffff;
  --ink: #1b1d2a;
  --muted: #5d6275;
  --line: #d9dce6;
  --accent: #3b4fd8;
  --mood: #3b4fd8;
  --mood-soft: #e6e9fb;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Atkinson Hyperlegible", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12131b; --panel: #1b1d28; --ink: #eceef6; --muted: #9aa0b6;
    --line: #2d3040; --accent: #8e9cff; --mood-soft: #262a40; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12131b; --panel: #1b1d28; --ink: #eceef6; --muted: #9aa0b6;
  --line: #2d3040; --accent: #8e9cff; --mood-soft: #262a40; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
.wrap { max-width: 46rem; margin: 0 auto; padding-inline: 16px; padding-block: 2rem 3rem; display: grid; gap: 1.5rem; }
header { display: grid; gap: .25rem; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 6vw, 2.75rem); line-height: 1.05; margin: 0; text-wrap: balance; }
h1 em { font-style: normal; color: var(--mood); transition: color .3s; }
.lede { margin: 0; color: var(--muted); max-width: 60ch; }
.label { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 1rem; display: grid; gap: .75rem; min-width: 0; }
textarea { width: 100%; min-height: 9rem; resize: vertical; border: 0; background: transparent; color: var(--ink); font: 1.1rem/1.6 var(--font-body); outline: none; }
.reading { font-size: 1.1rem; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }
.reading span { border-radius: 4px; transition: background .15s; }
.reading span.now { background: var(--mood-soft); box-shadow: 0 0 0 2px var(--mood-soft); color: var(--ink); }
.reading span.done { color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.row.between { justify-content: space-between; }
.moods { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: .5rem; }
.mood { --c: var(--accent); display: grid; gap: .1rem; text-align: left; padding: .6rem .75rem; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; cursor: pointer; }
.mood b { font-weight: 700; display: flex; align-items: center; gap: .45rem; }
.mood b::before { content: ""; width: .6rem; height: .6rem; border-radius: 50%; background: var(--c); flex: none; }
.mood small { color: var(--muted); font-size: .8rem; }
.mood[aria-pressed="true"] { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
.mood:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dials { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 1rem; }
.dial { display: grid; gap: .3rem; }
.dial .row { justify-content: space-between; }
.dial output { font-family: var(--font-mono); font-size: .85rem; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--mood); }
select { width: 100%; padding: .5rem; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; }
.transport { position: sticky; bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
.transport .panel { flex-direction: row; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; box-shadow: 0 8px 24px rgb(0 0 0 / .08); }
button.btn { font: 700 1rem var(--font-body); border-radius: 999px; padding: .65rem 1.3rem; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
button.btn.primary { background: var(--mood); border-color: var(--mood); color: #fff; }
button.btn:disabled { opacity: .45; cursor: not-allowed; }
.status { color: var(--muted); font-size: .9rem; margin-left: auto; min-width: 0; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-size: .9rem; cursor: pointer; text-decoration: underline; }
.warn { color: #b3261e; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <span class="label">Text to speech</span>
    <h1>Read it out <em id="moodWord">happy</em>.</h1>
    <p class="lede">Type or paste anything, pick a mood, and press Read. Each mood changes pitch, speed, loudness and the pauses between phrases.</p>
  </header>

  <section class="panel" aria-label="Your text">
    <div class="row between">
      <span class="label">Your text</span>
      <button class="link" id="clearBtn" type="button">Clear</button>
    </div>
    <textarea id="text" aria-label="Text to read aloud">Guess what? I finally finished the project! It took three long weeks, but it's done. Honestly, I can't believe it worked on the first try.</textarea>
    <div class="reading" id="reading" hidden></div>
  </section>

  <section class="panel" aria-label="Mood">
    <span class="label">Mood</span>
    <div class="moods" id="moods"></div>
  </section>

  <section class="panel" aria-label="Voice">
    <div class="row between">
      <span class="label">Voice &amp; fine-tuning</span>
      <button class="link" id="resetBtn" type="button">Reset to mood</button>
    </div>
    <div class="dial">
      <label for="voice" class="label">Voice</label>
      <select id="voice"></select>
    </div>
    <div class="dials">
      <div class="dial"><div class="row"><label for="pitch">Pitch</label><output id="pitchOut"></output></div><input type="range" id="pitch" min="0" max="2" step="0.05"></div>
      <div class="dial"><div class="row"><label for="rate">Speed</label><output id="rateOut"></output></div><input type="range" id="rate" min="0.5" max="2" step="0.05"></div>
      <div class="dial"><div class="row"><label for="volume">Loudness</label><output id="volumeOut"></output></div><input type="range" id="volume" min="0" max="1" step="0.05"></div>
      <div class="dial"><div class="row"><label for="pause">Pause between phrases</label><output id="pauseOut"></output></div><input type="range" id="pause" min="0" max="1500" step="50"></div>
    </div>
  </section>

  <div class="transport">
    <div class="panel">
      <button class="btn primary" id="playBtn" type="button">▶ Read</button>
      <button class="btn" id="pauseBtn" type="button" disabled>Pause</button>
      <button class="btn" id="stopBtn" type="button" disabled>Stop</button>
      <span class="status" id="status" role="status">Ready</span>
    </div>
  </div>
</div>

<script>
(() => {
  // Each mood: base pitch/rate/volume, pause (ms) between phrases,
  // wobble = random pitch/rate variation per phrase, split = break on commas too,
  // lift = extra pitch on "!" and "?" phrases.
  const MOODS = {
    neutral:   { name: "Neutral",   hint: "Plain and even",     color: "#6b7280", pitch: 1.0,  rate: 1.0,  volume: 1.0, pause: 150, wobble: 0,    split: false, lift: 0.1 },
    happy:     { name: "Happy",     hint: "Bright and warm",    color: "#e0a100", pitch: 1.35, rate: 1.1,  volume: 1.0, pause: 120, wobble: 0.08, split: false, lift: 0.2 },
    excited:   { name: "Excited",   hint: "Fast, high, bouncy", color: "#f05a28", pitch: 1.6,  rate: 1.35, volume: 1.0, pause: 60,  wobble: 0.15, split: false, lift: 0.3 },
    sad:       { name: "Sad",       hint: "Low, slow, heavy",   color: "#3f6fb5", pitch: 0.7,  rate: 0.78, volume: 0.7, pause: 700, wobble: 0.03, split: true,  lift: 0 },
    angry:     { name: "Angry",     hint: "Hard and punchy",    color: "#d0312d", pitch: 0.85, rate: 1.2,  volume: 1.0, pause: 250, wobble: 0.05, split: true,  lift: 0.05 },
    calm:      { name: "Calm",      hint: "Soft and steady",    color: "#2f9e7a", pitch: 0.95, rate: 0.85, volume: 0.8, pause: 450, wobble: 0,    split: true,  lift: 0 },
    scared:    { name: "Scared",    hint: "Shaky and hurried",  color: "#7b4fc9", pitch: 1.3,  rate: 1.25, volume: 0.75,pause: 300, wobble: 0.25, split: true,  lift: 0.25 },
    surprised: { name: "Surprised", hint: "Big rises",          color: "#d63384", pitch: 1.5,  rate: 1.05, volume: 1.0, pause: 200, wobble: 0.1,  split: false, lift: 0.45 },
    whisper:   { name: "Secretive", hint: "Quiet and low",      color: "#4b5563", pitch: 0.8,  rate: 0.9,  volume: 0.35,pause: 350, wobble: 0.02, split: true,  lift: 0 },
  };

  const $ = id => document.getElementById(id);
  const synth = window.speechSynthesis;
  const els = { text: $("text"), reading: $("reading"), moods: $("moods"), voice: $("voice"),
    pitch: $("pitch"), rate: $("rate"), volume: $("volume"), pause: $("pause"),
    play: $("playBtn"), pauseBtn: $("pauseBtn"), stop: $("stopBtn"), status: $("status") };

  let mood = "happy";
  let queue = [], idx = 0, running = false, paused = false, timer = null, token = 0;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  if (!synth) {
    els.status.textContent = "This browser can't speak text. Try Chrome, Edge or Safari.";
    els.status.classList.add("warn");
    els.play.disabled = true;
  }

  // Mood chips
  for (const [key, m] of Object.entries(MOODS)) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "mood"; b.dataset.mood = key;
    b.style.setProperty("--c", m.color);
    b.innerHTML = `<b>${m.name}</b><small>${m.hint}</small>`;
    b.addEventListener("click", () => setMood(key));
    els.moods.appendChild(b);
  }

  function setMood(key) {
    mood = key;
    const m = MOODS[key];
    document.documentElement.style.setProperty("--mood", m.color);
    $("moodWord").textContent = m.name.toLowerCase();
    els.moods.querySelectorAll(".mood").forEach(b => b.setAttribute("aria-pressed", b.dataset.mood === key));
    els.pitch.value = m.pitch; els.rate.value = m.rate; els.volume.value = m.volume; els.pause.value = m.pause;
    showDials();
    store.set("moodreader.mood", key);
  }

  function showDials() {
    $("pitchOut").textContent = (+els.pitch.value).toFixed(2) + "×";
    $("rateOut").textContent = (+els.rate.value).toFixed(2) + "×";
    $("volumeOut").textContent = Math.round(els.volume.value * 100) + "%";
    $("pauseOut").textContent = els.pause.value + " ms";
  }
  ["pitch", "rate", "volume", "pause"].forEach(k => els[k].addEventListener("input", showDials));
  $("resetBtn").addEventListener("click", () => setMood(mood));

  // Voices load asynchronously in most browsers
  function loadVoices() {
    if (!synth) return;
    const voices = synth.getVoices();
    const saved = store.get("moodreader.voice");
    els.voice.innerHTML = "";
    const def = document.createElement("option");
    def.value = ""; def.textContent = "Default voice";
    els.voice.appendChild(def);
    voices
      .slice()
      .sort((a, b) => (b.lang.startsWith("en") - a.lang.startsWith("en")) || a.name.localeCompare(b.name))
      .forEach(v => {
        const o = document.createElement("option");
        o.value = v.name; o.textContent = `${v.name} (${v.lang})`;
        if (v.name === saved) o.selected = true;
        els.voice.appendChild(o);
      });
  }
  if (synth) { loadVoices(); synth.addEventListener?.("voiceschanged", loadVoices); }
  els.voice.addEventListener("change", () => store.set("moodreader.voice", els.voice.value));

  // Split text into phrases; keep the exact source text for highlighting
  function phrases(text, splitCommas) {
    const re = splitCommas ? /[^.!?…,;:\n]+[.!?…,;:]*[\s]*|\n+/g : /[^.!?…\n]+[.!?…]*[\s]*|\n+/g;
    return (text.match(re) || []).filter(Boolean);
  }

  function renderReading(parts) {
    els.reading.innerHTML = "";
    parts.forEach(p => {
      const s = document.createElement("span");
      s.textContent = p;
      els.reading.appendChild(s);
    });
  }

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const jitter = amt => (Math.random() * 2 - 1) * amt;

  function speakNext(my) {
    if (my !== token) return;
    const spans = els.reading.children;
    if (idx > 0 && spans[idx - 1]) { spans[idx - 1].classList.remove("now"); spans[idx - 1].classList.add("done"); }
    if (idx >= queue.length) return finish("Done");

    const part = queue[idx];
    const clean = part.trim();
    if (!clean) { idx++; return speakNext(my); }

    const m = MOODS[mood];
    const base = { pitch: +els.pitch.value, rate: +els.rate.value, volume: +els.volume.value };
    const u = new SpeechSynthesisUtterance(clean);
    const exclaim = /[!?]\s*$/.test(clean);
    u.pitch = clamp(base.pitch + jitter(m.wobble) + (exclaim ? m.lift : 0), 0, 2);
    u.rate = clamp(base.rate * (1 + jitter(m.wobble / 2)) * (exclaim && mood === "angry" ? 1.1 : 1), 0.1, 10);
    u.volume = clamp(base.volume, 0, 1);
    const v = synth.getVoices().find(v => v.name === els.voice.value);
    if (v) { u.voice = v; u.lang = v.lang; }

    spans[idx]?.classList.add("now");
    u.onend = () => {
      if (my !== token) return;
      idx++;
      const endsSentence = /[.!?…]\s*$/.test(clean);
      const wait = +els.pause.value * (endsSentence ? 1 : 0.5);
      timer = setTimeout(() => speakNext(my), wait);
    };
    u.onerror = e => {
      if (my !== token || e.error === "interrupted" || e.error === "canceled") return;
      finish("Couldn't speak: " + e.error);
    };
    synth.speak(u);
  }

  function start() {
    const text = els.text.value;
    if (!text.trim()) { els.status.textContent = "Type something to read first."; els.text.focus(); return; }
    stop(true);
    token++;
    queue = phrases(text, MOODS[mood].split);
    idx = 0; running = true; paused = false;
    renderReading(queue);
    els.text.hidden = true; els.reading.hidden = false;
    setButtons();
    els.status.textContent = `Reading as ${MOODS[mood].name.toLowerCase()}…`;
    speakNext(token);
  }

  function stop(silent) {
    token++;
    clearTimeout(timer);
    if (synth) synth.cancel();
    running = false; paused = false;
    els.text.hidden = false; els.reading.hidden = true;
    setButtons();
    if (!silent) els.status.textContent = "Stopped";
  }

  function finish(msg) {
    running = false; paused = false;
    setButtons();
    els.status.textContent = msg;
    setTimeout(() => { if (!running) { els.text.hidden = false; els.reading.hidden = true; } }, 1200);
  }

  function togglePause() {
    if (!running) return;
    if (paused) { synth.resume(); paused = false; els.status.textContent = "Reading…"; }
    else { synth.pause(); paused = true; els.status.textContent = "Paused"; }
    setButtons();
  }

  function setButtons() {
    els.play.textContent = running ? "↻ Restart" : "▶ Read";
    els.pauseBtn.disabled = !running;
    els.pauseBtn.textContent = paused ? "Resume" : "Pause";
    els.stop.disabled = !running;
  }

  els.play.addEventListener("click", start);
  els.pauseBtn.addEventListener("click", togglePause);
  els.stop.addEventListener("click", () => stop(false));
  $("clearBtn").addEventListener("click", () => { stop(true); els.text.value = ""; store.set("moodreader.text", ""); els.text.focus(); });
  els.reading.addEventListener("click", () => stop(false));

  const savedText = store.get("moodreader.text");
  if (savedText) els.text.value = savedText;
  els.text.addEventListener("input", () => store.set("moodreader.text", els.text.value));

  const savedMood = store.get("moodreader.mood");
  setMood(MOODS[savedMood] ? savedMood : "happy");
  setButtons();
})();
</script>
</body>
</html>
